# Example secrets overlay for ./run.sh
# Usage:
#   cp examples/secrets.example.yml /path/to/k8s-secrets.yml   # keep outside git
#   # fill values, optionally: ansible-vault encrypt /path/to/k8s-secrets.yml
#   EXTRA_VARS_FILE=/path/to/k8s-secrets.yml ./run.sh
#
# These keys override group_vars/all/atlas-k8s-core.yml. Do not commit real secrets.
# vip_auth_pass must be <= 8 characters (Keepalived PASS).

vip_address: "192.168.1.210"
vip_auth_pass: "CHANGEME"
