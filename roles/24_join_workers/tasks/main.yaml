---
- name: Reset worker node before join
  ansible.builtin.command: kubeadm reset -f
  when: k8s_needs_join | default(false) | bool
  changed_when: true

- name: Generate fresh worker join command before worker join
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/kubeadm_generate_join_commands.yaml"
  vars:
    kubeadm_join_run_host: "{{ groups[k8s_master_hosts][0] }}"
    kubeadm_join_fact_host: "{{ k8s_cluster_fact_host }}"
    kubeadm_join_generate_control_plane_cmd: false
  run_once: true
  when: >-
    groups.get(k8s_worker_hosts, [])
    | map('extract', hostvars)
    | selectattr('k8s_needs_join', 'defined')
    | selectattr('k8s_needs_join')
    | list
    | length > 0

- name: Resolve worker join command
  ansible.builtin.set_fact:
    join_k8s: "{{ hostvars[k8s_cluster_fact_host].k8s_join_worker_cmd | trim }}"
  when:
    - k8s_needs_join | default(false) | bool
    - hostvars[k8s_cluster_fact_host].k8s_join_worker_cmd | default('') | length > 0

- name: Fail when worker join command is missing
  ansible.builtin.fail:
    msg: >-
      Worker join command was not generated on {{ groups[k8s_master_hosts][0] }}.
      Check kubeadm token create and admin kubeconfig on the first control-plane node.
  when:
    - k8s_needs_join | default(false) | bool
    - join_k8s is not defined

- name: Join worker node
  ansible.builtin.command: "{{ join_k8s }} --ignore-preflight-errors all"
  register: join_worker_result
  when:
    - k8s_needs_join | default(false) | bool
    - join_k8s is defined
  failed_when: false
  changed_when: join_worker_result.rc == 0
  no_log: true

- name: Report worker join failure
  ansible.builtin.fail:
    msg: >-
      kubeadm join failed on {{ inventory_hostname }} (rc={{ join_worker_result.rc }}):
      {{ join_worker_result.stderr | default(join_worker_result.stdout) | regex_replace('--token\\s+\\S+', '--token ***') }}
  when:
    - k8s_needs_join | default(false) | bool
    - join_worker_result is defined
    - join_worker_result.rc | default(0) != 0
    - "'already a member' not in (join_worker_result.stderr | default('') ~ join_worker_result.stdout | default(''))"

- name: Cleanup join command artifacts after successful worker join
  ansible.builtin.include_tasks: "{{ role_path }}/../common/tasks/kubeadm_cleanup_join_commands.yaml"
  vars:
    kubeadm_join_run_host: "{{ groups[k8s_master_hosts][0] }}"
    kubeadm_join_fact_host: "{{ k8s_cluster_fact_host }}"
    kubeadm_join_cleanup_facts: true
  run_once: true
  when:
    - join_worker_result is defined
    - join_worker_result.changed | default(false) | bool

- name: Wait for joined worker node to register in API
  ansible.builtin.command: kubectl get node {{ k8s_node_name }} --no-headers
  environment:
    KUBECONFIG: "{{ k8s_kubeadm_admin_kubeconfig }}"
  delegate_to: "{{ groups[k8s_master_hosts][0] }}"
  become: true
  register: join_worker_ready
  until: join_worker_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  when: >-
    (join_worker_result is defined and join_worker_result.changed | default(false))
    or (
      not (k8s_needs_join | default(false) | bool)
      and (k8s_kubelet_bootstrapped | default(false) | bool)
    )

- name: Label worker node loadtype
  ansible.builtin.command: kubectl label node {{ k8s_node_name }} loadtype=worker --overwrite
  environment:
    KUBECONFIG: "{{ k8s_kubeadm_admin_kubeconfig }}"
  delegate_to: "{{ groups[k8s_master_hosts][0] }}"
  become: true
  when: >-
    (join_worker_result is defined and join_worker_result.changed | default(false))
    or (
      not (k8s_needs_join | default(false) | bool)
      and (k8s_kubelet_bootstrapped | default(false) | bool)
    )
