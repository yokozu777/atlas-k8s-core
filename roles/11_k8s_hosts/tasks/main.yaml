    - name: Reload systemd to pick up any changes to unit files
      command: systemctl daemon-reload
      notify:
        - Restart services

    - name: Flush handlers to restart services immediately
      meta: flush_handlers

    - name: start seriveces
      service: name="{{ item }}" state=started enabled=yes
      loop:
        - containerd.service
        - kubelet.service

    - name: k8s images pull
      command: kubeadm config images pull

